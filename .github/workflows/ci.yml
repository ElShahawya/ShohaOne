name: SHAHA ONE — Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Lint, Type Check & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Type Check (tsc)
        run: npm run lint

      - name: Verify Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Security Audit (Production dependencies)
        run: npm audit --audit-level=high || true
